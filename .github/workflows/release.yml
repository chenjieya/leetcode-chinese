name: 发布插件
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm run check:bundle-size
      - name: 校验版本与标签
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const m=require('./manifest.json'); if(m.version!==process.env.RELEASE_TAG || m.id!=='leetcode-chinese') process.exit(1)"
      - name: 创建发布包
        run: zip leetcode-chinese.zip main.js manifest.json styles.css LICENSE README.md
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --title "LeetCode Chinese $RELEASE_TAG" --notes-file "docs/7-发版与回滚/$RELEASE_TAG-发布说明.md" main.js manifest.json styles.css leetcode-chinese.zip
